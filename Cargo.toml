[workspace]
members = [
    "src-tauri",
    "crates/pebble-core",
    "crates/pebble-store",
    "crates/pebble-privacy",
    "crates/pebble-mail",
    "crates/pebble-search",
    "crates/pebble-rules",
    "crates/pebble-translate",
    "crates/pebble-crypto",
    "crates/pebble-oauth",
    "crates/pebble-webdav",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-build = { version = "2", features = [] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["aws_lc_rs", "tls12"] }
webpki-roots = "0.26"
mail-parser = "0.9"
tantivy = "0.22"
ammonia = "4"
lol_html = "1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
tokio-socks = "0.5"
native-tls = "0.2"
tokio-native-tls = "0.3"
aes-gcm = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
hex = "0.4"
semver = "1"
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Argon2id (backup passphrase KDF) is unusably slow without optimisations.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
