name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies for known vulnerabilities
        run: cargo audit

  test:
    name: Test and Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:windows
          - os: macos-15
            build_script: build:macos
          - os: ubuntu-latest
            build_script: build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libkeyutils-dev \
            patchelf \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      # Fails when src/lib/generated/ipc.ts no longer matches the Rust IPC types
      # (also covered by the workspace run above; kept explicit for a clear
      # failure message). Regenerate: UPDATE_IPC_BINDINGS=1 cargo test -p pebble ipc_bindings
      - name: Check generated IPC bindings
        run: cargo test -p pebble --lib ipc_bindings

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build:frontend

      - name: Build desktop package
        run: pnpm ${{ matrix.build_script }}

      - name: Upload Linux package artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pebble-linux-packages
          path: |
            target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
