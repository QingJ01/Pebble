name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.1
        required: true
        default: v0.2.1

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Build jobs only need to read the repository; the publish job is the only
# one that gets write access.
permissions:
  contents: read

jobs:
  windows:
    name: Windows Release
    runs-on: windows-latest
    environment: action

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Validate release version
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, got '$tag'."
          }
          $version = $Matches.version

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"(?<version>[^"]+)"') {
            throw "Could not read src-tauri/Cargo.toml package version."
          }
          $cargoVersion = $Matches.version

          $versions = @{
            "package.json" = $packageVersion
            "src-tauri/tauri.conf.json" = $tauriVersion
            "src-tauri/Cargo.toml" = $cargoVersion
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "$($entry.Key) version '$($entry.Value)' does not match tag '$tag'."
            }
          }
          "PEBBLE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate OAuth build config
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "MICROSOFT_CLIENT_ID")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "$name is not configured in the 'action' GitHub environment."
            }
          }
          "OAuth client IDs and Google client secret are configured for this release build."
          # Outlook uses a public client with PKCE; no Microsoft client secret is embedded.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Run frontend tests
        run: pnpm test

      # Optional code signing: only active when WINDOWS_CERTIFICATE (base64
      # PFX) and WINDOWS_CERTIFICATE_PASSWORD secrets exist. Without them the
      # installer is built unsigned exactly as before.
      - name: Configure optional Windows code signing
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "Windows code signing secrets are not configured; building an unsigned installer."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "pebble-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath -Force
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.signing.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding utf8
          "PEBBLE_TAURI_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Windows code signing is enabled for this build."

      - name: Build Windows installer
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $extraArgs = @()
          if ($env:PEBBLE_TAURI_SIGNING_CONFIG) {
            $extraArgs = @("--config", $env:PEBBLE_TAURI_SIGNING_CONFIG)
          }
          pnpm build:windows @extraArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect release artifacts
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $installers = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -File
          if ($installers.Count -eq 0) {
            throw "No NSIS installer found in target/release/bundle/nsis."
          }

          foreach ($installer in $installers) {
            Copy-Item -Path $installer.FullName -Destination $artifactDir
          }

          Get-ChildItem -Path $artifactDir -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ascii
          }

          Get-ChildItem -Path $artifactDir -File | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pebble-windows-${{ env.PEBBLE_VERSION }}
          path: release-artifacts/*
          if-no-files-found: error

  linux:
    name: Linux Package Release
    runs-on: ubuntu-latest
    environment: action

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libkeyutils-dev \
            patchelf \
            rpm

      - name: Validate release version
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got '$tag'." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          package_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          tauri_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")"
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version '$package_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$tauri_version" != "$version" ]]; then
            echo "src-tauri/tauri.conf.json version '$tauri_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "src-tauri/Cargo.toml version '$cargo_version' does not match tag '$tag'." >&2
            exit 1
          fi

          echo "PEBBLE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate OAuth build config
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET MICROSOFT_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is not configured in the 'action' GitHub environment." >&2
              exit 1
            fi
          done
          echo "OAuth client IDs and Google client secret are configured for this release build."
          # Outlook uses a public client with PKCE; no Microsoft client secret is embedded.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: pnpm build:linux

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          artifact_dir="release-artifacts"
          mkdir -p "$artifact_dir"

          search_dirs=(
            "target/release/bundle/appimage"
            "src-tauri/target/release/bundle/appimage"
            "target/release/bundle/deb"
            "src-tauri/target/release/bundle/deb"
            "target/release/bundle/rpm"
            "src-tauri/target/release/bundle/rpm"
          )

          found=()
          for dir in "${search_dirs[@]}"; do
            if [[ -d "$dir" ]]; then
              while IFS= read -r -d '' package; do
                found+=("$package")
              done < <(find "$dir" -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -print0)
            fi
          done

          if [[ "${#found[@]}" -eq 0 ]]; then
            echo "No Linux package artifacts found in expected bundle directories." >&2
            exit 1
          fi

          for package in "${found[@]}"; do
            cp "$package" "$artifact_dir/$(basename "$package")"
          done

          for file in "$artifact_dir"/*; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$(basename "$file")" > "$file.sha256"
          done

          ls -lh "$artifact_dir"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pebble-linux-packages-${{ env.PEBBLE_VERSION }}
          path: release-artifacts/*
          if-no-files-found: error

  macos:
    name: macOS Release (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    environment: action

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Validate release version
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got '$tag'." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          package_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          tauri_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")"
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version '$package_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$tauri_version" != "$version" ]]; then
            echo "src-tauri/tauri.conf.json version '$tauri_version' does not match tag '$tag'." >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "src-tauri/Cargo.toml version '$cargo_version' does not match tag '$tag'." >&2
            exit 1
          fi

          echo "PEBBLE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate OAuth build config
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET MICROSOFT_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is not configured in the 'action' GitHub environment." >&2
              exit 1
            fi
          done
          echo "OAuth client IDs and Google client secret are configured for this release build."
          # Outlook uses a public client with PKCE; no Microsoft client secret is embedded.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Optional code signing / notarization: Tauri picks these variables up
      # during `tauri build`. They are only exported when the secrets exist,
      # so builds without them stay unsigned instead of failing.
      - name: Configure optional macOS code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_var() {
            local delimiter="PEBBLE_EOF_$RANDOM$RANDOM"
            {
              echo "$1<<$delimiter"
              printf '%s\n' "${!1}"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }
          if [[ -n "${APPLE_CERTIFICATE:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            export_var APPLE_CERTIFICATE
            export_var APPLE_CERTIFICATE_PASSWORD
            export_var APPLE_SIGNING_IDENTITY
            echo "macOS code signing is enabled for this build."
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
              export_var APPLE_ID
              export_var APPLE_PASSWORD
              export_var APPLE_TEAM_ID
              echo "macOS notarization is enabled for this build."
            fi
          else
            echo "macOS code signing secrets are not configured; building an unsigned app."
          fi

      - name: Build macOS app
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          artifact_dir="release-artifacts"
          mkdir -p "$artifact_dir"

          search_dirs=(
            "target/${{ matrix.target }}/release/bundle/dmg"
            "target/release/bundle/dmg"
          )

          found=()
          for dir in "${search_dirs[@]}"; do
            if [[ -d "$dir" ]]; then
              while IFS= read -r -d '' dmg; do
                found+=("$dmg")
              done < <(find "$dir" -maxdepth 1 -type f -name "*.dmg" -print0)
            fi
          done

          if [[ "${#found[@]}" -eq 0 ]]; then
            echo "No DMG found in expected macOS bundle directories." >&2
            exit 1
          fi

          for dmg in "${found[@]}"; do
            base="$(basename "$dmg")"
            stem="${base%.dmg}"
            cp "$dmg" "$artifact_dir/${stem}-${{ matrix.arch }}.dmg"
          done

          for file in "$artifact_dir"/*; do
            hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$(basename "$file")" > "$file.sha256"
          done

          ls -lh "$artifact_dir"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pebble-macos-${{ matrix.arch }}-${{ env.PEBBLE_VERSION }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Complete Release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    environment: action
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pebble-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify release artifact set
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(release-artifacts/*.exe)
          appimages=(release-artifacts/*.AppImage)
          debs=(release-artifacts/*.deb)
          rpms=(release-artifacts/*.rpm)
          macos_arm=(release-artifacts/*-arm64.dmg)
          macos_x64=(release-artifacts/*-x64.dmg)
          checksums=(release-artifacts/*.sha256)
          if (( ${#windows[@]} == 0 || ${#appimages[@]} == 0 || ${#debs[@]} == 0 || ${#rpms[@]} == 0 || ${#macos_arm[@]} == 0 || ${#macos_x64[@]} == 0 )); then
            echo "Incomplete platform artifact set." >&2
            find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          expected_checksums=$((${#windows[@]} + ${#appimages[@]} + ${#debs[@]} + ${#rpms[@]} + ${#macos_arm[@]} + ${#macos_x64[@]}))
          if (( ${#checksums[@]} != expected_checksums )); then
            echo "Expected $expected_checksums checksums, found ${#checksums[@]}." >&2
            exit 1
          fi
          (cd release-artifacts && sha256sum --check --strict *.sha256)

      - name: Create draft, upload complete asset set, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          title="Pebble $tag"
          notes_file="$RUNNER_TEMP/release-notes.md"
          escaped_version="$(printf '%s' "$version" | sed 's/[][\\.^$*+?{}|()]/\\&/g')"
          awk -v version="$escaped_version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists; refusing to replace or unpublish it." >&2
            exit 1
          fi
          gh release create "$tag" --draft --verify-tag --title "$title" --notes-file "$notes_file"
          gh release upload "$tag" release-artifacts/*
          gh release edit "$tag" --draft=false
